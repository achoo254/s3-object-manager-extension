# Local S3-compatible server for development and CI. Test-only keys live in
# docker/seaweedfs-s3.json; they are not secrets and only work against this container.
# Every bucket becomes a SeaweedFS collection with its own volumes, hence the generous
# -volume.max: tests create a fresh bucket per run.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: >-
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -volume.max=100 -master.volumeSizeLimitMB=256
    ports:
      # Local machine only: the test keys in docker/seaweedfs-s3.json are public.
      - '127.0.0.1:8333:8333'
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
