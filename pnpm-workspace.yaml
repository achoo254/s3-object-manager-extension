allowBuilds:
  esbuild: true
# Refuse versions published less than 7 days ago (minutes). Dependabot already waits 14 days;
# this floor also covers versions added by hand.
minimumReleaseAge: 10080
# Exact versions already in the lockfile, released 2026-10-05 (passed review then); they age past
# the floor on 2026-10-13 and this list can then be dropped.
minimumReleaseAgeExclude:
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - acorn@8.19.0
  - magic-string@1.4.3
  - nanoid@3.3.20
  - postcss@8.5.29
