name: Release

# Pushing a tag vX.Y.Z builds the Chrome and Edge packages and attaches them to a GitHub
# Release. A tag with a suffix (vX.Y.Z-beta.N) makes a pre-release for testing by hand.
# Uploading to the stores is done by hand (no store tokens are kept in CI).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ] && [[ "$GITHUB_REF_NAME" != "$version-"* ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Build zips
        # Pre-releases get a fixed extension ID so testers keep their saved connections when
        # updating; store releases must not carry a manifest key.
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then export PRERELEASE_BUILD=1; fi
          pnpm zip
      - name: Create GitHub Release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
            {
              echo "Bản thử nghiệm — chưa nộp store."
              echo
              echo "## Cài lần đầu"
              echo
              echo "1. Tải \`*-chrome.zip\` (Chrome) hoặc \`*-edge.zip\` (Edge) bên dưới và giải nén vào một thư mục cố định."
              echo "2. Mở \`chrome://extensions\` (hoặc \`edge://extensions\`), bật **Developer mode**."
              echo "3. Bấm **Load unpacked**, chọn thư mục vừa giải nén."
              echo "4. Bấm icon extension trên thanh công cụ để mở trang quản lý."
              echo
              echo "## Cập nhật (giữ nguyên các kết nối đã lưu)"
              echo
              echo "1. Giải nén bản mới **đè vào đúng thư mục cũ**."
              echo "2. Trong trang extensions, bấm **Reload** (biểu tượng mũi tên tròn) trên thẻ extension."
              echo
              echo "**Không bấm Remove (gỡ)** — gỡ extension sẽ xoá các kết nối đã lưu."
              echo
              cat CHANGELOG.md
            } > release-notes.md
          else
            cp CHANGELOG.md release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" .output/*.zip --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md --verify-tag "${flags[@]}"
